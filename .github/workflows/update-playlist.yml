name: Zeus TV M3U8 Botu

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Botu Çalıştır
        run: python zeus_bot.py

      - name: Değişiklikleri GitHub'a Yükle
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add teyzeniyerim1/

          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "🤖 Otomatik Güncelleme: index.txt güncellendi"
            git push
          fi
