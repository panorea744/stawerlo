name: Zeus TV M3U8 Botu

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3 cloudscraper

      - name: Botu Çalıştır
        run: python zeus_bot.py

      - name: Değişiklikleri GitHub'a Yükle
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add teyzeniyerim1/
          git add ventino.m3u
          
          git diff-index --quiet HEAD || git commit -m "🤖 Otomatik Güncelleme: Kanallar Yenilendi"
          git push
