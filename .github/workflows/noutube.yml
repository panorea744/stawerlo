name: noutube updater

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: repo klonla
        uses: actions/checkout@v4

      - name: python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: bağımlılıkları kur
        run: pip install yt-dlp

      - name: script çalıştır
        run: python noutube.py

      - name: commit at
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "auto update m3u8"
          git push
