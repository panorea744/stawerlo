name: Gotazor Link Update

on:
  schedule:
    # Her 10 dakikada bir otomatik çalışır
    - cron: '*/10 * * * *'
  workflow_dispatch:
    # GitHub arayüzünden manuel başlatma butonu sağlar

jobs:
  build:
    runs-on: ubuntu-latest
    # Yazma izni verilmesi gerekir (Dosyaları güncelleyebilmesi için)
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Gotazor Script
        run: |
          python gotazor.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # gotazor klasörünü ve içindeki m3u8 dosyalarını ekle
          git add gotazor/*.m3u8
          # Değişiklik yoksa hata vermeden bitir, varsa pushla
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update links: $(date +'%d-%m-%Y %H:%M')" && git push)
