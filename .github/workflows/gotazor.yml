name: Gotazor Link Update

on:
  schedule:
    # Her 10 dakikada bir çalışır
    - cron: '*/10 * * * *'
  workflow_dispatch:
    # Manuel çalıştırma butonunu aktif eder

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/set-up-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Gotazor Script
        run: |
          python gotazor.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add gotazor/*.m3u8
          # Sadece değişiklik varsa commit yap, yoksa hata verme
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update links: $(date)" && git push)
